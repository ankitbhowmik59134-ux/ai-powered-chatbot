server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=ai-powered-chatbot

spring.datasource.url=jdbc:h2:file:./data/chatbot;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2

chat.api.url=${CHAT_API_URL:https://api.groq.com/openai/v1/chat/completions}
chat.api.key=${CHAT_API_KEY:}
chat.api.model=${CHAT_API_MODEL:llama-3.1-8b-instant}
chat.wiki.enabled=true
